name: Build and Release

on:
  push:
    branches:
      - master
      - develop
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies fast
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dosbox xvfb make mtools

      - name: Run DOSBox build (headless)
        run: |
          chmod +x build.sh
          xvfb-run -a ./build.sh

      - name: Show DOSBox log
        if: always()
        run: |
          echo "=== DOSBOX LOG OUTPUT ==="
          cat dosbox_build.log || echo "(no log file)"

      - name: Create DOS floppy images
        if: success()
        run: |
          mkdir -p floppies
          EXE=$(basename src/*.EXE)
          SOURCE_FILES=(
            src/*.C
            src/*.H
            src/*.ASM
            src/*.PRJ
            src/MAKEFILE
            src/README.MD
          )
          echo "Creating floppy images for $EXE ..."

          copy_files_to_image() {
            local image_path="$1"
            mcopy -i "$image_path" "src/$EXE" ::
            mmd -i "$image_path" ::/SOURCES
            mcopy -i "$image_path" "${SOURCE_FILES[@]}" ::/SOURCES
          }

          # 360 KiB (5.25" DD)
          mformat -f 360 -C -v SLOT360 -i floppies/floppy_360k.img ::
          copy_files_to_image floppies/floppy_360k.img

          # 720 KiB (3.5" DD)
          mformat -f 720 -C -v SLOT720 -i floppies/floppy_720k.img ::
          copy_files_to_image floppies/floppy_720k.img

          # 1.44 MiB (3.5" HD)
          mformat -f 1440 -C -v SLOT144 -i floppies/floppy_1440k.img ::
          copy_files_to_image floppies/floppy_1440k.img

          echo "Floppy images created:"
          ls -lh floppies/

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: slototter-build
          path: |
            src/*.EXE
            floppies/*.img

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: slototter-build
          path: release

      - name: Verify extracted files
        run: |
          echo "Contents of release folder:"
          find release -type f -printf "%p (%k KiB)\n" | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            Automated release for **${{ github.ref_name }}**.

            Includes:
            - Compiled SLOTOTTER.EXE
            - 360 KiB / 720 KiB / 1.44 MiB DOS floppy images (.img)

            Build produced by GitHub Actions using DOSBox.
          files: |
            release/src/*.EXE
            release/floppies/*.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}