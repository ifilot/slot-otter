name: Build and Release

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/driver-tests.yml

  driver:
    name: OTTERSD public packages
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and filesystem tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dosbox make mtools dosfstools ripgrep
      - name: Check release tag matches the driver
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 driver/release.py --check-tag "$GITHUB_REF_NAME"
      - name: Build standalone DOS driver
        run: bash driver/build.sh "$RUNNER_TEMP/ottersd-build"
      - name: Package driver-only floppies and empty SD images
        run: python3 driver/release.py --driver "$RUNNER_TEMP/ottersd-build/OTTERSD.EXE" --output release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: ottersd-release
          path: release-assets/
          if-no-files-found: error
      - name: Retain private build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ottersd-build-diagnostics
          path: ${{ runner.temp }}/ottersd-build/*.MAP
          if-no-files-found: ignore

  legacy:
    name: Legacy OTTERNAV executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install legacy build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dosbox make
      - name: Build legacy Navigator
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: otternav-legacy
          path: src/OTTERNAV.EXE
          if-no-files-found: error

  release:
    needs: [driver, legacy]
    # A legacy build failure must not block the primary driver release.
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.driver.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ottersd-release
          path: release/ottersd
      - name: Publish OTTERSD release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OTTERSD ${{ github.ref_name }}
          fail_on_unmatched_files: true
          body: |
            OTTERSD is the primary DOS software for Slot-otter.
            Version 1.0.0 is the first stable release.

            Download OTTERSD-DOS.zip or a 360 KiB / 720 KiB / 1.44 MiB
            installation floppy. Floppies contain the driver and user
            instructions, with no testing utilities. They are not boot disks.

            Recommended: **OTTERSD-FAT16-500MiB.zip**, with 16 KiB clusters.
            OTTERSD-FAT32-500MiB.zip is the alternative with 4 KiB clusters.
            Both are empty formatted volumes. Writing the IMG to the entire
            card replaces existing partitions and files; back up first.
            Whole images are 501 MiB including the partition offset.

            For browsing and copying files, use Nightwatch with OTTERSD:
            https://github.com/ifilot/nightwatch

            OTTERNAV remains a separate legacy download when its build succeeds.
            Source is included in GitHub's source archives for this tag.
          files: |
            release/ottersd/OTTERSD.EXE
            release/ottersd/OTTERSD-DOS.zip
            release/ottersd/floppy_*.img
            release/ottersd/OTTERSD-FAT16-500MiB.zip
            release/ottersd/OTTERSD-FAT32-500MiB.zip
            release/ottersd/README.TXT
            release/ottersd/RELEASE.JSON
            release/ottersd/SHA256.TXT
      - name: Download optional legacy executable
        if: needs.legacy.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: otternav-legacy
          path: release/legacy
      - name: Attach optional legacy executable
        if: needs.legacy.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: release/legacy/OTTERNAV.EXE
