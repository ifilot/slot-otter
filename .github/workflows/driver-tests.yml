name: Driver regression tests
on:
  push:
    paths:
      - 'driver/**'
      - '.github/workflows/driver-tests.yml'
  pull_request:
    paths:
      - 'driver/**'
      - '.github/workflows/driver-tests.yml'
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Filesystem validation tools
        run: sudo apt-get update && sudo apt-get install -y mtools dosfstools
      - name: Production C unit tests, coverage, and regression sensitivity
        run: python3 driver/tests/run.py --coverage "$RUNNER_TEMP/otter-coverage" --mutations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-coverage
          path: ${{ runner.temp }}/otter-coverage
